<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f18">
<title>Orbit 聊天 · 连接中</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 800px at 50% -10%, #16213e 0%, #0b0f18 55%, #070a11 100%);
    color: #e8ecf4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card { width: 100%; max-width: 420px; text-align: center; }
  .logo {
    width: 92px; height: 92px; margin: 0 auto 26px; border-radius: 28px;
    background: linear-gradient(140deg, #1d4ed8, #3b82f6 55%, #60a5fa);
    box-shadow: 0 18px 50px rgba(37, 99, 235, .45), inset 0 1px 0 rgba(255,255,255,.28);
    display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 800;
    color: #fff; letter-spacing: 1px;
  }
  h1 { font-size: 22px; margin: 0 0 10px; font-weight: 700; letter-spacing: .5px; }
  #status { font-size: 15px; color: #a7b3c9; min-height: 22px; line-height: 1.6; }
  .bar { height: 3px; border-radius: 3px; background: rgba(255,255,255,.09); overflow: hidden; margin: 26px 0 18px; }
  .bar i { display: block; height: 100%; width: 38%; border-radius: 3px; background: linear-gradient(90deg, #3b82f6, #60a5fa); animation: slide 1.25s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(320%); } }
  #tip { font-size: 13px; color: #6f7d94; line-height: 1.7; margin-top: 16px; word-break: break-all; }
  button#retry {
    display: none; margin: 22px auto 0; padding: 13px 34px; border: 0; border-radius: 14px;
    background: linear-gradient(140deg, #2563eb, #3b82f6); color: #fff; font-size: 16px; font-weight: 600;
    box-shadow: 0 10px 26px rgba(37, 99, 235, .38); cursor: pointer;
  }
  button#retry:active { transform: scale(.98); }
  .foot { position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom)); font-size: 12px; color: #4d5a70; text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">O</div>
    <h1>Orbit 聊天</h1>
    <div id="status">正在读取服务器地址…</div>
    <div class="bar"><i></i></div>
    <div id="tip">免费通道偶尔拥堵，本页会自动重试，无需手动刷新。</div>
    <button id="retry">重新尝试</button>
  </div>
  <div class="foot">Orbit · 手机后端固定入口</div>
<script>
(function () {
  'use strict';
  var statusEl = document.getElementById('status');
  var tipEl = document.getElementById('tip');
  var retryBtn = document.getElementById('retry');
  var attempt = 0;
  var timer = null;
  var MAX_ATTEMPTS = 20;

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function setStatus(t) { statusEl.textContent = t; }

  function getServerUrl() {
    return fetch('./server.json?_=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('server.json ' + r.status);
        return r.json();
      })
      .then(function (d) {
        if (!d || !d.url) throw new Error('server.json 缺少 url');
        return String(d.url).replace(/\/+$/, '');
      });
  }

  function checkHealth(url) {
    var ctl = new AbortController();
    var to = setTimeout(function () { ctl.abort(); }, 9000);
    return fetch(url + '/health', { cache: 'no-store', signal: ctl.signal })
      .then(function (r) { return r.ok; })
      .catch(function () { return false; })
      .then(function (ok) { clearTimeout(to); return ok; });
  }

  async function tick() {
    attempt++;
    if (attempt > 1) setStatus('正在连接服务器…（第 ' + attempt + ' 次尝试）');
    var url = null;
    try {
      url = await getServerUrl();
    } catch (e) {
      setStatus('读取服务器地址失败，正在重试…');
    }
    if (url) {
      var ok = await checkHealth(url);
      if (ok) {
        setStatus('已连接，正在打开聊天…');
        tipEl.textContent = '首次打开如果看到 “Continue to Site”，点一下即可进入。';
        setTimeout(function () { location.replace(url + '/'); }, 350);
        return;
      }
      setStatus('通道拥堵（免费隧道偶发 502），自动重试中…');
    }
    if (attempt < MAX_ATTEMPTS) {
      timer = setTimeout(tick, 1500);
    } else {
      setStatus('暂时连不上服务器');
      tipEl.textContent = '已自动重试 ' + MAX_ATTEMPTS + ' 次。免费通道可能正拥堵，稍等一会儿再点下面的按钮。';
      retryBtn.style.display = 'inline-block';
    }
  }

  retryBtn.addEventListener('click', function () {
    attempt = 0;
    retryBtn.style.display = 'none';
    tipEl.textContent = '免费通道偶尔拥堵，本页会自动重试，无需手动刷新。';
    tick();
  });

  // 切回页面时如果之前已经放弃自动重试，自动再来一轮
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && attempt >= MAX_ATTEMPTS) retryBtn.click();
  });

  tick();
})();
</script>
</body>
</html>
