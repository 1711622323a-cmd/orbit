<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orbit 聊天 · 连接中</title>
<style>
body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0f18;color:#e5e7eb;font-family:-apple-system,"PingFang SC",sans-serif;text-align:center}
.sp{width:38px;height:38px;margin:0 auto 16px;border:3px solid #1e293b;border-top-color:#3b82f6;border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
h1{font-size:19px;margin:0 0 10px;font-weight:600}
p{font-size:13px;color:#94a3b8;margin:0;line-height:1.7}
a{color:#60a5fa}
</style>
</head>
<body>
<div>
  <div class="sp"></div>
  <h1>正在连接 Orbit 后端…</h1>
  <p id="tip">读取服务器地址</p>
</div>
<script>
(async () => {
  const tip = document.getElementById('tip');
  for (let i = 1; i <= 12; i++) {
    try {
      const r = await fetch('./server.json?t=' + Date.now(), { cache: 'no-store' });
      const d = await r.json();
      if (d && d.url) { location.replace(d.url); return; }
    } catch (e) {}
    tip.textContent = '第 ' + i + ' 次尝试…';
    await new Promise(r => setTimeout(r, 2000));
  }
  tip.innerHTML = '后端暂时离线。<a href="" onclick="location.reload();return false">点此重试</a>';
})();
</script>
</body>
</html>
